model_id: final-tri-model
seed: 42
device: cpu
epochs: 1
early_stopping:
  enabled: true
  monitor: mAP
  mode: max
  patience: 10
  min_delta: 0.001
  min_epochs: 10
batch_size: 2
learning_rate: 5.0e-05
num_workers: 0
image_size: 384
pretrained: false
compile: false
max_train_samples: 2
max_val_samples: 2
output_dir: runs
criterion:
  name: AsymmetricLoss
  gamma_pos: 0.1
  gamma_neg: 1.0
  clip: 0.05
  eps: 1.0e-08
optimizer:
  name: AdamW
