n_valid_replicates: 10000
random_seed: 42
confidence_level: 0.95
sampling_unit: SeriesGroup
invalid_if_any_label_has_no_positive: true
max_attempts: 1000000

inputs:
  baseline:
    seed_42: outputs/baseline/runs/seed_42/test_predictions.npz
    seed_43: outputs/baseline/runs/seed_43/test_predictions.npz
    seed_44: outputs/baseline/runs/seed_44/test_predictions.npz
  final-tri-model:
    seed_42: outputs/final-tri-model/runs/seed_42/test_predictions.npz
    seed_43: outputs/final-tri-model/runs/seed_43/test_predictions.npz
    seed_44: outputs/final-tri-model/runs/seed_44/test_predictions.npz

output_dir: outputs/bootstrap
